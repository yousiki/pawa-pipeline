name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ffmpeg: the render/finalize tests encode and probe short videos.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The nightly channel and components come from rust-toolchain.toml.
      - run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just lint
      - run: just test
      - run: bash -n ops/*.sh

  # Builds the runtime image on every change to check that it still builds. It is never pushed:
  # the image contains the Minecraft client and server (not redistributable under the Minecraft
  # EULA) and GPL-3.0 components, so users build it themselves with `just image`.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: pawa-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
