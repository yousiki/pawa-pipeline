[package]
name = "pawa-align"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
pawa-schema = { path = "../schema" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
