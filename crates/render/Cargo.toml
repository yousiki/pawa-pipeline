[package]
name = "pawa-render"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
pawa-schema = { path = "../schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

# The render launches a JVM that launches Minecraft, and Xvfb outlives whoever spawned it unless
# somebody kills it. `ProcessGroup::leader()` puts each of those under its own process group so one
# signal reaps the whole tree — a watchdog kill that only reached the launcher wrapper would leave a
# 4 GB JVM holding the lane's display forever. Default features are off because they are the Windows
# (job-object, creation-flags) and Tokio (kill-on-drop) halves of the crate; this stage is
# synchronous and Linux-only, so `std` + `process-group` is the whole surface used.
process-wrap = { version = "9", default-features = false, features = [
    "std",
    "process-group",
    "tracing",
] }

tempfile = "3"

[dev-dependencies]
