[package]
name = "pawa"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
pawa-align = { path = "../align" }
pawa-capture = { path = "../capture" }
pawa-hud = { path = "../hud" }
pawa-render = { path = "../render" }
pawa-schema = { path = "../schema" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
sha2 = "0.10"
anyhow = "1"
tempfile = "3"
# `kill(-pgid)`: the render warmup stops the whole HeadlessMC + game process group.
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
